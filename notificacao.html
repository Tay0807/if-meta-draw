<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/styles/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/preferencias.js"></script>
    <title>Notificações</title>
</head>

<body>
    <!-- Aqui você pode copiar o menu lateral completo do index.html -->

    <section class="flex-fill bg-white p-4">
        <div class="d-flex align-items-center mb-4">
            <span class="me-3 mb-0 fw-light" style="color: var(--color-verdePrincipal); font-size: 1rem;">
                Notificações
            </span>
            <div class="flex-grow-1 border-bottom" style="border-color: var(--color-verdePrincipal) !important;"></div>
        </div>

        <div id="metasHoje"></div>
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const containerHoje = document.getElementById("metasHoje");
            const metas = JSON.parse(localStorage.getItem("lista")) || [];
            const hoje = new Date().toISOString().split("T")[0];

            const metasHoje = metas.filter(meta => !meta.lixeira && meta.data === hoje);

            if (metasHoje.length === 0) {
                containerHoje.innerHTML = "<p class='text-muted'>Nenhuma meta para hoje.</p>";
                return;
            }

            let html = "<h6 class='mb-3 texto_container_principal'>Metas com prazo para hoje:</h6>";
            metasHoje.forEach(meta => {
                html += `
          <div class="alert alert-primary d-flex justify-content-between align-items-center">
            <div>
              <strong>${meta.nome}</strong><br/>
              <small>${meta.materia || ""} - ${meta.tipo_atividade || ""}</small>
            </div>
            <span class="badge bg-secondary">${meta.data}</span>
          </div>`;
            });

            containerHoje.innerHTML = html;
        });
    </script>
</body>

</html>
